<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#0A0E1A"/>
  <!-- Brain silhouette with neural-net nodes -->
  <ellipse cx="16" cy="15" rx="11" ry="10" fill="none" stroke="#22D3EE" stroke-width="1.2" opacity="0.9"/>
  <!-- Cerebral fissure -->
  <path d="M16 6 Q17 11 16 15 Q15 19 16 24" stroke="#22D3EE" stroke-width="0.8" opacity="0.7" fill="none"/>
  <!-- Neural nodes -->
  <circle cx="10" cy="12" r="1.4" fill="#22D3EE" opacity="0.95"/>
  <circle cx="16" cy="9"  r="1.4" fill="#22D3EE" opacity="0.95"/>
  <circle cx="22" cy="12" r="1.4" fill="#22D3EE" opacity="0.95"/>
  <circle cx="22" cy="18" r="1.4" fill="#22D3EE" opacity="0.95"/>
  <circle cx="16" cy="21" r="1.4" fill="#22D3EE" opacity="0.95"/>
  <circle cx="10" cy="18" r="1.4" fill="#22D3EE" opacity="0.95"/>
  <circle cx="13" cy="15" r="1.0" fill="#67E8F9" opacity="0.8"/>
  <circle cx="19" cy="15" r="1.0" fill="#67E8F9" opacity="0.8"/>
  <!-- Synaptic connections -->
  <line x1="10" y1="12" x2="16" y2="9"  stroke="#22D3EE" stroke-width="0.6" opacity="0.5"/>
  <line x1="16" y1="9"  x2="22" y2="12" stroke="#22D3EE" stroke-width="0.6" opacity="0.5"/>
  <line x1="22" y1="12" x2="22" y2="18" stroke="#22D3EE" stroke-width="0.6" opacity="0.5"/>
  <line x1="22" y1="18" x2="16" y2="21" stroke="#22D3EE" stroke-width="0.6" opacity="0.5"/>
  <line x1="16" y1="21" x2="10" y2="18" stroke="#22D3EE" stroke-width="0.6" opacity="0.5"/>
  <line x1="10" y1="18" x2="10" y2="12" stroke="#22D3EE" stroke-width="0.6" opacity="0.5"/>
  <line x1="10" y1="12" x2="13" y2="15" stroke="#67E8F9" stroke-width="0.5" opacity="0.4"/>
  <line x1="16" y1="9"  x2="13" y2="15" stroke="#67E8F9" stroke-width="0.5" opacity="0.4"/>
  <line x1="22" y1="12" x2="19" y2="15" stroke="#67E8F9" stroke-width="0.5" opacity="0.4"/>
  <line x1="22" y1="18" x2="19" y2="15" stroke="#67E8F9" stroke-width="0.5" opacity="0.4"/>
  <line x1="13" y1="15" x2="19" y2="15" stroke="#67E8F9" stroke-width="0.5" opacity="0.4"/>
  <!-- Stem / cerebellum -->
  <path d="M16 24 L15 28 L17 28 Z" fill="#22D3EE" opacity="0.7"/>
</svg>
